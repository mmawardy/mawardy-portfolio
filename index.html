<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mawardy | محمد المواردي</title>
<meta name="description" content="Mohamed Almawardy: video editor, motion designer, and web, app and game developer.">
<meta name="theme-color" content="#3D0713">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Anton&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body class="is-loading">

<div id="loader" aria-hidden="true">
  <img class="loader-mark" src="assets/img/mark-cream.png" alt="">
  <div class="loader-count"><span id="loaderNum">0</span>%</div>
</div>

<canvas id="sparks" aria-hidden="true"></canvas>

<header class="top">
  <a href="#home" class="top-logo" aria-label="Mawardy"><img src="assets/img/logo-cream.png" alt="Mawardy"></a>
  <p class="top-role" data-i18n="topRole"></p>
</header>

<main>
  <section id="home" class="hero">
    <p class="hero-eyebrow"><span class="dot"></span><span data-i18n="eyebrow"></span></p>
    <h1 class="hero-title" id="heroTitle"></h1>

    <div class="hero-grid">
      <div class="hero-copy">
        <p class="hero-hello" data-i18n="hello"></p>
        <h2 class="hero-name" data-i18n="name"></h2>
        <span class="name-rule" aria-hidden="true"></span>
        <p class="hero-bio" data-i18n="bio"></p>
        <div class="hero-actions">
          <a class="btn btn-solid" href="#video" data-i18n="ctaWork"></a>
          <a class="btn btn-line" href="#contact" data-i18n="ctaContact"></a>
        </div>
      </div>

      <div class="hero-portrait">
        <div class="portrait-frame" id="portrait"></div>
        <p class="portrait-tag" data-i18n="portraitTag"></p>
      </div>

      <ul class="hero-facts" id="heroFacts"></ul>
    </div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <section id="video" class="section dept">
    <p class="kicker" data-i18n="videoKicker"></p>
    <h2 class="heading" data-i18n="videoTitle"></h2>
    <p class="section-sub reveal" data-i18n="videoSub"></p>
    <div class="video-grid folder-grid" id="folderGrid"></div>
  </section>

  <section id="web" class="section cream dept">
    <p class="kicker" data-i18n="webKicker"></p>
    <h2 class="heading" data-i18n="webTitle"></h2>
    <p class="section-sub reveal" data-i18n="webSub"></p>
    <div class="sites" id="sitesList"></div>
  </section>

  <section id="apps" class="section dept">
    <p class="kicker" data-i18n="appsKicker"></p>
    <h2 class="heading" data-i18n="appsTitle"></h2>
    <p class="section-sub reveal" data-i18n="appsSub"></p>
    <div class="apps" id="appsList"></div>
  </section>

  <section id="wins" class="section wins">
    <p class="kicker" data-i18n="winsKicker"></p>
    <h2 class="heading" data-i18n="winsTitle"></h2>
    <div class="stats" id="stats"></div>
  </section>

  <section id="about" class="section cream">
    <p class="kicker" data-i18n="aboutKicker"></p>
    <h2 class="heading" data-i18n="aboutTitle"></h2>
    <div class="about-cols">
      <p class="lead reveal" data-i18n="about1"></p>
      <p class="reveal" data-i18n="about2"></p>
    </div>
    <div class="matrix" id="matrix"></div>
  </section>

  <section id="contact" class="section contact">
    <p class="kicker" data-i18n="contactKicker"></p>
    <h2 class="contact-title" data-i18n="contactTitle"></h2>
    <p class="section-sub reveal" data-i18n="contactSub"></p>
    <div class="contact-actions reveal">
      <a class="btn btn-solid" id="whatsappBtn" target="_blank" rel="noopener" data-i18n="whatsapp"></a>
    </div>
    <div class="socials reveal" id="socials"></div>
  </section>
</main>

<footer class="foot">
  <img src="assets/img/logo-cream.png" alt="Mawardy">
  <p>© <span id="year"></span> <span data-i18n="name"></span></p>
</footer>

<nav class="dock" aria-label="Sections">
  <a href="#home" data-i18n="navHome"></a>
  <a href="#video" data-i18n="navVideo"></a>
  <a href="#web" data-i18n="navWeb"></a>
  <a href="#apps" data-i18n="navApps"></a>
  <a href="#contact" data-i18n="navContact"></a>
  <button type="button" id="langBtn" class="dock-lang" aria-label="Switch language"></button>
</nav>

<dialog id="collection" aria-labelledby="collectionTitle">
  <div class="collection-head">
    <div>
      <p class="kicker" id="collectionCount"></p>
      <h2 class="collection-title" id="collectionTitle"></h2>
      <p class="collection-desc" id="collectionDesc"></p>
    </div>
    <button type="button" id="collectionClose" aria-label="Close">×</button>
  </div>
  <div class="video-grid" id="collectionGrid"></div>
</dialog>

<dialog id="lightbox" aria-label="Video">
  <button type="button" id="lightboxClose" aria-label="Close">×</button>
  <video id="lightboxVideo" controls playsinline></video>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="content.js?v=5"></script>
<script src="main.js?v=5"></script>
</body>
</html>
